name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DVTT_CUDA=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package standalone app
        run: cmake --build build --config Release --target package-standalone

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: iscc packaging/windows/VoiceToText.iss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VoiceToText-Windows
          path: dist/installer/VoiceToText-Windows-Setup.exe

      - name: Create GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/VoiceToText-Windows-Setup.exe

  macos-packaging:
    name: macOS packaging status
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Explain macOS port requirement
        run: |
          echo "The repository currently contains a Windows-only Win32 application."
          echo "A working macOS installer will be enabled after the macOS app port is implemented."

      - name: Upload macOS packaging instructions
        uses: actions/upload-artifact@v4
        with:
          name: VoiceToText-macOS-packaging
          path: packaging/macos/README.md
